name: Monitor ceny TUI

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Europe/Warsaw"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tui-price-monitor
  cancel-in-progress: false

jobs:

  check-price:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # POBRANIE REPOZYTORIUM
      # ==========================================

      - name: Pobierz repozytorium
        uses: actions/checkout@v7


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # ==========================================
      # INSTALACJA BIBLIOTEK
      # ==========================================

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium


      # ==========================================
      # SPRAWDZENIE CENY TUI
      # ==========================================

      - name: Sprawdz cene TUI
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          python monitor_tui.py


      # ==========================================
      # ZAPIS OSTATNIEJ CENY
      # ==========================================

      - name: Zapisz ostatnia cene
        run: |
          echo "Sprawdzam plik ostatnia_cena.json"

          if [ ! -f ostatnia_cena.json ]; then
            echo "BLAD: Program nie utworzyl ostatnia_cena.json"
            exit 1
          fi

          echo "Plik istnieje."

          # Zachowujemy cene wyliczona przez program
          cp ostatnia_cena.json /tmp/ostatnia_cena.json

          # Pobieramy najnowsza wersje repozytorium
          git fetch origin main
          git reset --hard origin/main

          # Przywracamy nowa cene
          cp /tmp/ostatnia_cena.json ostatnia_cena.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ostatnia_cena.json

          if git diff --cached --quiet; then
            echo "Cena bez zmian."
            exit 0
          fi

          git commit -m "Aktualizacja ceny TUI"
          git push origin main

          echo "Nowa cena zostala zapisana."

          fi


      # ==========================================
      # DIAGNOSTYKA W RAZIE BLEDU
      # ==========================================

      - name: Zachowaj dane diagnostyczne
        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: tui-diagnostyka

          path: |
            ostatnia_strona.txt
            ostatni_zrzut.png

          if-no-files-found: ignore

          retention-days: 3
